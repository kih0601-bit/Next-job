<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest"><title>Next Job</title><style>
body{margin:0;background:#08111f;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:24px 18px 14px;border-bottom:1px solid #23314a}h1{margin:0;font-size:34px}.sub,.small{color:#94a3b8}main{padding:14px 14px 100px;max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#121c2f;border:1px solid #23314a;border-radius:18px;padding:16px}.wide{grid-column:1/-1}.metric{font-size:30px;font-weight:800}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.btn{background:#a78bfa;color:#1f163d;border:0;border-radius:12px;padding:10px 12px;font-weight:800;text-decoration:none}.job{background:#18243a;border-radius:14px;padding:13px;margin:10px 0}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#2a2450;color:#ddd6fe;font-size:11px;margin:2px}nav{position:fixed;bottom:0;left:0;right:0;background:#08111ff7;border-top:1px solid #23314a;display:flex;justify-content:space-around;padding:12px 6px calc(12px + env(safe-area-inset-bottom))}nav button{background:none;border:0;color:#94a3b8;font-weight:700}nav button.active{color:white}section{display:none}section.active{display:block}input,select{width:100%;background:#0d1729;color:white;border:1px solid #334155;border-radius:12px;padding:11px;margin-bottom:10px}.item{padding:12px 0;border-top:1px solid #23314a}.item:first-child{border-top:0}
</style></head><body><header><h1>Next Job</h1><div class="sub">v3.0 · GitHub 자동수집 안정형</div></header><main>
<section id="home" class="active"><div class="grid"><div class="card"><div class="sub">감시 기관</div><div class="metric" id="instCount">0</div></div><div class="card"><div class="sub">수집 공고</div><div class="metric" id="jobCount">0</div></div><div class="card"><div class="sub">고졸 적합</div><div class="metric" id="fitCount">0</div></div><div class="card"><div class="sub">이번 달 예상</div><div class="metric" id="expectedCount">0</div></div><div class="card wide"><div class="row spread"><h3>자동수집 상태</h3><button class="btn" id="refreshBtn">새로 불러오기</button></div><div id="status" class="small"></div></div><div class="card wide"><h3>추천 공고</h3><div id="recommended"></div></div></div></section>
<section id="jobs"><input id="search" placeholder="기관·공고 검색"><div id="jobList"></div></section>
<section id="watch"><div id="instList" class="card"></div></section>
<section id="forecast"><div id="forecastList" class="card"></div></section>
<section id="guide"><div class="card"><h3>처음 한 번 할 일</h3><div class="item">GitHub 저장소 → Actions</div><div class="item">Update job postings 선택</div><div class="item">Run workflow → Run workflow</div><div class="item">1~2분 뒤 앱에서 새로 불러오기</div></div></section>
</main><nav><button class="active" data-tab="home">홈</button><button data-tab="jobs">공고</button><button data-tab="watch">기관</button><button data-tab="forecast">예상</button><button data-tab="guide">안내</button></nav><script>
let inst=[],feed={jobs:[],sources:[],stats:{}};const month=new Date().getMonth()+1;const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){status.textContent='불러오는 중...';try{[inst,feed]=await Promise.all([fetch('./data/institutions.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('./data/jobs.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json())]);status.textContent=feed.updatedAt?new Date(feed.updatedAt).toLocaleString()+' 갱신 · '+feed.stats.success+'/'+feed.stats.sourceCount+'개 출처':'아직 첫 수집 전입니다.';render()}catch(e){status.textContent='불러오기 실패: '+e.message}}
function card(j){return `<div class="job"><b>${esc(j.org)}</b><div>${esc(j.title)}</div><div>${(j.fitReasons||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><div style="margin-top:8px"><a class="btn" target="_blank" href="${esc(j.link)}">공고 열기</a></div></div>`}
function render(){instCount.textContent=inst.length;jobCount.textContent=(feed.jobs||[]).length;fitCount.textContent=(feed.jobs||[]).filter(j=>j.fitScore>=4).length;expectedCount.textContent=inst.filter(i=>i.months.includes(month)).length;recommended.innerHTML=(feed.jobs||[]).filter(j=>j.fitScore>=4).slice(0,8).map(card).join('')||'<div class="small">추천 공고 없음</div>';renderJobs();instList.innerHTML=inst.map(i=>`<div class="item"><div class="row spread"><b>${i.name}</b><a class="btn" target="_blank" href="${i.source}">공식 채용</a></div><div class="small">${i.eligibility} · 예상 ${i.months.join(', ')}월</div></div>`).join('');forecastList.innerHTML=[...inst].sort((a,b)=>b.months.includes(month)-a.months.includes(month)).map(i=>`<div class="item"><b>${i.name}</b><div class="small">${i.months.join(', ')}월 · 신뢰도 ${i.confidence}</div></div>`).join('')}
function renderJobs(){const q=(search.value||'').toLowerCase();jobList.innerHTML=(feed.jobs||[]).filter(j=>(j.org+' '+j.title).toLowerCase().includes(q)).map(card).join('')||'<div class="small">수집된 공고 없음</div>'}
refreshBtn.onclick=load;search.oninput=renderJobs;document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));document.getElementById(b.dataset.tab).classList.add('active')});load();
</script></body></html>
