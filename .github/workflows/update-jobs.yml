name: Update job postings

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install public document tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr tesseract-ocr-kor \
            python3-pip \
            unzip antiword file \
            libreoffice-writer libreoffice-calc
          python3 -m pip install --user --break-system-packages pyhwp || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify document tools
        shell: bash
        run: |
          set +e
          echo "PATH=$PATH"
          for tool in pdftotext pdftoppm tesseract hwp5txt unzip antiword libreoffice file; do
            echo "===== $tool ====="
            command -v "$tool" || true
            "$tool" --version 2>&1 | head -n 3 || "$tool" -v 2>&1 | head -n 3 || true
          done
          python3 -m pip show pyhwp || true

      - name: Run collector self-test
        run: node scripts/test-v11.mjs

      - name: Preserve previous pipeline report
        shell: bash
        run: |
          if [ -s data/pipeline-report.json ]; then
            cp data/pipeline-report.json data/pipeline-report.previous.json
          fi

      - name: Probe institution pipelines
        run: node scripts/pipeline-probe.mjs

      - name: Build unified institution report
        run: node scripts/build-unified-report.mjs

      - name: Save diagnostic evidence
        run: node scripts/save-diagnostic-evidence.mjs

      - name: Compare with previous run
        run: node scripts/compare-pipeline-reports.mjs

      - name: Check regressions
        run: node scripts/run-regression-check.mjs

      - name: Update pipeline history
        run: node scripts/update-pipeline-history.mjs

      - name: Collect job postings
        run: node scripts/collect.mjs

      - name: Verify debug outputs
        shell: bash
        run: |
          set -euxo pipefail
          ls -la data/
          test -s data/debug-report.json
          test -s data/jobs.json
          echo "debug-report bytes: $(wc -c < data/debug-report.json)"
          node -e "const r=require('./data/debug-report.json'); console.log(JSON.stringify(r.documentToolDiagnostics,null,2));"

      - name: Upload diagnostic bundle
        uses: actions/upload-artifact@v4
        with:
          name: next-job-diagnostics
          path: |
            data/pipeline-report.json
            data/pipeline-diff.json
            data/regression-report.json
            data/pipeline-history.json
            data/pipeline-artifacts.json
            data/diagnostics/
          retention-days: 14

      - name: Commit updated jobs and diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "next-job-bot"
          git config user.email "next-job-bot@users.noreply.github.com"
          git add -A data/
          echo "Files staged:"
          git diff --cached --name-status
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "자동 채용공고 및 디버그 로그 업데이트"
          git push
