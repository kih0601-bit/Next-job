name: Update job postings

on:
  workflow_dispatch:
  schedule:
    # 매일 오전 7시 10분(KST) = 전날 22시 10분(UTC)
    - cron: "10 22 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run pipeline diagnostics
        run: node scripts/pipeline-probe.mjs

      - name: Collect job postings
        run: node scripts/collect.mjs

      - name: Commit updated jobs
        shell: bash
        run: |
          if git diff --quiet -- data/jobs.json data/source-health.json data/pipeline-report.json data/pipeline-artifacts.json; then
            echo "No changes"
            exit 0
          fi

          git config user.name "next-job-bot"
          git config user.email "next-job-bot@users.noreply.github.com"
          git add data/jobs.json data/source-health.json data/pipeline-report.json data/pipeline-artifacts.json
          git commit -m "자동 채용공고 업데이트"
          git push
