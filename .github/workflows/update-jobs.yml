name: Update job postings
env:
  NEXTJOB_DETAIL_DIAG_DIR: data/diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start run metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run-metrics.mjs start

      - name: Install public document tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-kor python3-pip unzip antiword file libreoffice-writer libreoffice-calc
          python3 -m pip install --user --break-system-packages pyhwp || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify document tools
        shell: bash
        run: |
          set +e
          for tool in pdftotext pdftoppm tesseract hwp5txt unzip antiword libreoffice file; do
            echo "===== $tool ====="
            command -v "$tool" || true
            "$tool" --version 2>&1 | head -n 3 || "$tool" -v 2>&1 | head -n 3 || true
          done
          python3 -m pip show pyhwp || true

      - name: Remove retired institution data
        run: node scripts/cleanup-retired-sources.mjs

      - name: Clean legacy diagnostic paths
        run: node scripts/cleanup-legacy-diagnostics.mjs

      - name: Run collector self-tests
        run: |
          node scripts/test-v11.mjs
          node scripts/test-v90-pagination.mjs
          node scripts/test-v87-governance.mjs
          node scripts/test-v92-safety-and-workflow.mjs

      - name: Preserve previous pipeline report
        shell: bash
        run: |
          if [ -s data/pipeline-report.json ]; then cp data/pipeline-report.json data/pipeline-report.previous.json; fi

      - name: Probe institution pipelines
        run: |
          node scripts/run-metrics.mjs mark probe-start
          node scripts/pipeline-probe.mjs
          node scripts/run-metrics.mjs mark probe-end

      - name: Collect job postings
        run: |
          node scripts/run-metrics.mjs mark collect-start
          node scripts/collect.mjs
          node scripts/run-metrics.mjs mark collect-end

      - name: Build unified institution report
        run: |
          node scripts/run-metrics.mjs mark unifiedReport-start
          node scripts/build-unified-report.mjs
          node scripts/run-metrics.mjs mark unifiedReport-end

      - name: Save diagnostic evidence
        run: |
          node scripts/run-metrics.mjs mark verification-start
          node scripts/save-diagnostic-evidence.mjs

      - name: Compare with previous run
        run: node scripts/compare-pipeline-reports.mjs

      - name: Check regressions
        run: node scripts/run-regression-check.mjs

      - name: Update pipeline history
        run: node scripts/update-pipeline-history.mjs

      - name: Sync current source status
        run: node scripts/sync-source-status.mjs

      - name: Clean generated diagnostic paths
        run: node scripts/cleanup-legacy-diagnostics.mjs

      - name: Finish verification metrics
        if: always()
        run: node scripts/run-metrics.mjs mark verification-end || true

      - name: Finalize run metrics
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run-metrics.mjs finalize

      - name: Verify outputs and path safety
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test -s data/debug-report.json
          test -s data/jobs.json
          test -s data/run-metrics.json
          node scripts/test-v92-safety-and-workflow.mjs

      - name: Upload diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-job-diagnostics
          path: |
            data/pipeline-report.json
            data/pipeline-diff.json
            data/regression-report.json
            data/pipeline-history.json
            data/pipeline-artifacts.json
            data/run-metrics.json
            data/requirement-report.json
            data/diagnostics/
          retention-days: 14

      - name: Commit updated jobs and diagnostics
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "next-job-bot"
          git config user.email "next-job-bot@users.noreply.github.com"
          git add -A data/ docs/source-status.json
          git diff --cached --name-status
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "자동 채용공고 및 디버그 로그 업데이트"
          git push
