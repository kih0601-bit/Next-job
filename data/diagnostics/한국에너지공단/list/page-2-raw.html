<script type="text/javascript">

	$(document).ready(function(){

		fn_InitGrid1();

	//[Fn] 그리드 Init
	function fn_InitGrid1(){
		G_FormParamInit("frm",["","BBS001","","","","","","",""]);
		//[2]그리드 초기화
		G_DT.init({
			//그리드 표출 컬럼 정의
			arrColModel : [
				{
					data:"titl",
					className:"text-left",
					orderable:false,
		        	render:function(data,type,row){
		        		return "<a href=\"javascript:void(0);\" onclick=\"fn_Detail('"+row.bbsNo+"')\" style=\"cursor:pointer\">"+data+"</a>";
		        	}
				},
		        {
					data:"crtDtm",
					className:"text-center",
					orderable:false,
		        	render:function(data,type,row){
		        		return "<a href=\"javascript:void(0);\" onclick=\"fn_Detail('"+row.bbsNo+"')\" style=\"cursor:pointer\">"+data+"</a>";
		        	}
				}
			],
			buttons  : false,		//버튼 사용하지 않음(Excel,PDF)
			gridId   : "dataTableA",	//그리드 테이블 ID
			formId   : "frm",		//그리드 Form ID
			order    : [[0,"asc"]],	//정렬배열
			url      : "/job/admmgr/mng/BS/BSLGridList.do",//Server Side URL
			dblclick : false,		//더블클릭여부(true시 callback함수명 고정 : fn_DTGridDBClick)
			checkbox : false,
			lengthChange : false
		});
	}
	//[Fn] 그리드 Init

			arrColModel : [
				{
					data:"title",

		        	}

			lengthChange : false
		});
	}

		});
	}



	
	function fn_Detail(bbsNo) {
		G_UI.modalPage({
	    	url   : "/job/front/BS/BSView.do",
	    	param : {
	    		title        : "게시글 상세보기",
	    		bbsNo        : bbsNo
	    	}
		});
	}

	
	function fn_Recrute(notiNo) {
		G_UI.modalPage({
	    	url   : "/job/front/recrute/recruteView.do",
	    	param : {
	    		title        : "채용공고 상세보기",
	    		notiNo        : notiNo
	    	}
		});
	}

	function fn_Recrute3(notiNo) {
		G_UI.modalPage({
	    	url   : "/job/front/recrute/recruteView3.do",
	    	param : {
	    		title        : "채용결과 상세보기",
	    		notiNo        : notiNo
	    	}
		});
	}


	
	function fnRecruteList(){
		$("#frm").attr("action","/job/front/recrute/recruteList.do");
	    $("#frm").submit();
	}
	
	function fnRecruteDetail(num){
		var arrFormParam = new Array();
	    arrFormParam.push(num);
	    G_FormParamInit("frm",arrFormParam);
	    $("#frm").attr("action","/job/front/recrute/recruteView.do");
	    $("#frm").submit();
	}
	
	$(document).on("click","#btnRecruteMore",function(){
		fnRecruteList();
	});
	
	function fnRecruteDetail(num){
		var arrFormParam = new Array();
	    arrFormParam.push(num);
	    arrFormParam.push("");
	    arrFormParam.push("");
	    arrFormParam.push("");
	    arrFormParam.push("");
	    arrFormParam.push("");
	    arrFormParam.push("");
	    G_FormParamInit("frm",arrFormParam);
	    $("#frm").attr("action","/job/front/recrute/recruteView.do");
	    $("#frm").submit();
	}
</script>
