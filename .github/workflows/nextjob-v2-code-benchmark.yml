name: Next Job v2 Code-only 100 Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      NEXTJOB_BENCHMARK_TARGET: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Code-only unit tests
        run: node v2-prototype/tests/code-only.test.mjs
      - name: Capture 100 real API cases and code predictions
        run: node v2-prototype/src/run-code-benchmark.mjs
      - name: Upload code benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjob-v2-code-benchmark-100
          path: v2-prototype/output/code-benchmark/
          if-no-files-found: error
          retention-days: 14
