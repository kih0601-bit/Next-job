<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Next Job</title>
  <style>
    :root{
      --bg:#07101d;--card:#111d31;--card2:#17263e;--text:#f8fafc;
      --muted:#94a3b8;--purple:#a78bfa;--green:#34d399;
      --orange:#fbbf24;--red:#fb7185;--blue:#38bdf8;
      --line:rgba(255,255,255,.08)
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#07101d,#0a1424);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}
    header{position:sticky;top:0;z-index:8;display:flex;justify-content:space-between;align-items:center;padding:18px 17px 13px;background:rgba(7,16,29,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    h1{font-size:30px;margin:2px 0 0}.eyebrow{font-size:12px;color:#c4b5fd;font-weight:800}
    .refresh{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:#142139;color:#fff;font-size:22px}
    main{max-width:850px;margin:auto;padding:14px 14px 110px}
    section{display:none}section.active{display:block}
    .card{background:linear-gradient(180deg,#16243a,#101b2f);border:1px solid var(--line);border-radius:21px;padding:16px}
    .hero{display:flex;justify-content:space-between;gap:14px;background:linear-gradient(135deg,#1b2945,#241d47)}
    .hero h2{font-size:23px;margin:6px 0}.muted{font-size:13px;color:var(--muted)}
    .update{height:max-content;padding:8px 10px;border-radius:999px;background:rgba(52,211,153,.13);color:#86efac;font-size:11px;font-weight:800;white-space:nowrap}
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:11px}
    .stat span{font-size:13px;color:var(--muted)}.stat strong{display:block;font-size:29px;margin-top:7px}
    .heading{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 9px}.heading h3{margin:0}
    .link-btn{border:0;background:none;color:#c4b5fd;font-weight:800}
    .toolbar{position:sticky;top:78px;z-index:5;background:rgba(7,16,29,.91);backdrop-filter:blur(15px);padding:8px 0 10px}
    input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:#0d1829;color:white;outline:none}
    .chips{display:flex;gap:7px;overflow:auto;padding-top:9px}.chip{border:1px solid var(--line);border-radius:999px;background:#142139;color:#cbd5e1;padding:9px 12px;white-space:nowrap}.chip.active{background:var(--purple);color:#21163d}
    .job{margin:10px 0;padding:15px;background:linear-gradient(180deg,#17263e,#101b2f);border:1px solid var(--line);border-radius:19px}
    .job-top{display:flex;justify-content:space-between;gap:12px}.org{font-size:14px;font-weight:800;color:#c4b5fd}.title{font-size:17px;font-weight:850;margin-top:4px}
    .star{border:0;background:none;font-size:24px;color:#596579}.star.on{color:#facc15}
    .badges{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0}.badge{padding:6px 8px;border-radius:999px;background:#26364f;color:#cbd5e1;font-size:11px;font-weight:800}
    .green{background:rgba(52,211,153,.14);color:#86efac}.blue{background:rgba(56,189,248,.14);color:#7dd3fc}.orange{background:rgba(251,191,36,.14);color:#fde68a}.red{background:rgba(251,113,133,.14);color:#fda4af}
    .summary{background:#0c1728;border-radius:14px;padding:12px}.summary b{display:block;font-size:12px;color:#a5b4fc;margin-bottom:7px}.summary ul{margin:0;padding-left:18px;color:#dbeafe}.summary li{margin:4px 0;font-size:14px}
    .actions{display:flex;gap:8px;margin-top:11px}.primary,.secondary{border:0;border-radius:13px;padding:11px 13px;font-weight:800;text-decoration:none}.primary{background:var(--purple);color:#21163d}.secondary{background:#26364f;color:white}
    .empty{text-align:center;color:var(--muted);padding:30px 10px}
    .inst{padding:13px 0;border-top:1px solid var(--line)}.inst:first-child{border-top:0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
    nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom));background:rgba(7,16,29,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
    nav button{border:0;background:none;color:#718096;font-size:11px;font-weight:800}nav button span{display:block;font-size:20px;margin-bottom:3px}nav button.active{color:white}
    .sheet{position:fixed;inset:0;z-index:30;opacity:0;pointer-events:none;transition:.2s}.sheet.open{opacity:1;pointer-events:auto}.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
    .panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;padding:18px;background:#0e1a2d;border-radius:24px 24px 0 0;transform:translateY(100%);transition:.25s}.sheet.open .panel{transform:translateY(0)}
    .handle{width:45px;height:5px;border-radius:999px;background:#475569;margin:0 auto 14px}.close{position:absolute;right:15px;top:12px;width:34px;height:34px;border:0;border-radius:50%;background:#26364f;color:white;font-size:21px}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detail-cell{padding:12px;border-radius:13px;background:#17263e}.detail-cell span{display:block;color:var(--muted);font-size:11px}.detail-cell strong{display:block;margin-top:5px}
    @media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
<header>
  <div><div class="eyebrow">울산 공공기관 취업비서</div><h1>Next Job</h1></div>
  <button id="refreshBtn" class="refresh">↻</button>
</header>

<main>
  <section id="home" class="active">
    <div class="hero card">
      <div><div class="eyebrow">오늘의 브리핑</div><h2>안녕하세요 시우님</h2><div id="briefing" class="muted">최신 공고를 확인하고 있어요.</div></div>
      <div id="updateBadge" class="update">갱신 전</div>
    </div>
    <div class="stats">
      <div class="stat card"><span>감시 기관</span><strong id="instCount">0</strong></div>
      <div class="stat card"><span>전체 공고</span><strong id="jobCount">0</strong></div>
      <div class="stat card"><span>고졸 적합</span><strong id="fitCount">0</strong></div>
      <div class="stat card"><span>이번 달 예상</span><strong id="expectedCount">0</strong></div>
    </div>
    <div class="heading"><h3>추천 공고</h3><button class="link-btn" data-go="jobs">전체보기</button></div>
    <div id="recommended"></div>
  </section>

  <section id="jobs">
    <div class="toolbar">
      <input id="search" placeholder="기관·직무·키워드 검색">
      <div class="chips">
        <button class="chip active" data-filter="all">전체</button>
        <button class="chip" data-filter="fit">고졸 가능</button>
        <button class="chip" data-filter="ulsan">울산</button>
        <button class="chip" data-filter="regular">정규직</button>
      </div>
    </div>
    <div id="jobList"></div>
  </section>

  <section id="favorites"><div class="heading"><h3>즐겨찾기</h3></div><div id="favoriteList"></div></section>
  <section id="institutions"><input id="instSearch" placeholder="기관 검색"><div id="instList" class="card" style="margin-top:10px"></div></section>
  <section id="settings"><div class="card"><h3>자동수집 상태</h3><div id="status" class="muted">확인 중...</div></div></section>
</main>

<nav>
  <button class="active" data-tab="home"><span>⌂</span>홈</button>
  <button data-tab="jobs"><span>▤</span>공고</button>
  <button data-tab="favorites"><span>★</span>관심</button>
  <button data-tab="institutions"><span>◎</span>기관</button>
  <button data-tab="settings"><span>⚙</span>설정</button>
</nav>

<div id="sheet" class="sheet">
  <div class="backdrop" data-close></div>
  <div class="panel">
    <div class="handle"></div><button class="close" data-close>×</button>
    <div id="detail"></div>
  </div>
</div>

<script>
let institutions=[], feed={jobs:[],sources:[],stats:{}}, filter='all';
const state=JSON.parse(localStorage.getItem('nextJobUI')||'null')||{favorites:[],seen:{}};
const save=()=>localStorage.setItem('nextJobUI',JSON.stringify(state));
const month=new Date().getMonth()+1;
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const key=j=>(j.org+'|'+j.title).toLowerCase().replace(/\s+/g,' ').trim();

function classify(j){
  const t=((j.title||'')+' '+(j.raw||'')+' '+(j.fitReasons||[]).join(' ')).toLowerCase();
  return {
    fit:/고졸|학력무관/.test(t)||Number(j.fitScore||0)>=4,
    ulsan:/울산|울주|새울/.test(t),
    regular:/정규직|무기계약직|채용형/.test(t)
  };
}
function summary(j){
  const c=classify(j),a=[];
  a.push(c.fit?'고졸 또는 학력무관 지원 가능성이 있습니다.':'학력 조건은 원문 확인이 필요합니다.');
  if(c.ulsan)a.push('울산 근무 관련 키워드가 포함돼 있습니다.');
  if(c.regular)a.push('정규직 계열 표현이 포함돼 있습니다.');
  a.push(j.deadline?`마감일은 ${j.deadline}입니다.`:'마감일은 원문에서 확인해야 합니다.');
  return a.slice(0,4);
}
function badge(x,c=''){return `<span class="badge ${c}">${x}</span>`}
function card(j){
  const c=classify(j),k=key(j),fav=state.favorites.includes(k),isNew=!state.seen[k];
  return `<article class="job">
    <div class="job-top"><div><div class="org">${esc(j.org)}</div><div class="title">${esc(j.title)}</div></div><button class="star ${fav?'on':''}" onclick='fav(${JSON.stringify(k)})'>★</button></div>
    <div class="badges">${isNew?badge('NEW','red'):''}${c.fit?badge('고졸 가능','green'):badge('학력 확인')}${c.ulsan?badge('울산','blue'):''}${c.regular?badge('정규직 계열','green'):''}${j.deadline?badge(j.deadline,'orange'):badge('마감 확인')}</div>
    <div class="summary"><b>한눈에 보는 요약</b><ul>${summary(j).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="actions"><button class="primary" onclick='openDetail(${JSON.stringify(k)})'>상세보기</button><a class="secondary" target="_blank" href="${esc(j.link)}">원문보기</a></div>
  </article>`
}
function visibleJobs(){
  const q=(search.value||'').toLowerCase();
  return (feed.jobs||[]).filter(j=>{
    const c=classify(j),txt=(j.org+' '+j.title+' '+(j.raw||'')).toLowerCase();
    if(q&&!txt.includes(q))return false;
    if(filter==='fit'&&!c.fit)return false;
    if(filter==='ulsan'&&!c.ulsan)return false;
    if(filter==='regular'&&!c.regular)return false;
    return true;
  });
}
function render(){
  instCount.textContent=institutions.length;
  jobCount.textContent=(feed.jobs||[]).length;
  fitCount.textContent=(feed.jobs||[]).filter(j=>classify(j).fit).length;
  expectedCount.textContent=institutions.filter(i=>(i.months||[]).includes(month)).length;
  const unseen=(feed.jobs||[]).filter(j=>!state.seen[key(j)]).length;
  briefing.textContent=unseen?`새 공고 ${unseen}건이 아직 확인되지 않았어요.`:'확인하지 않은 새 공고가 없습니다.';
  updateBadge.textContent=feed.updatedAt?new Date(feed.updatedAt).toLocaleDateString():'갱신 전';
  status.textContent=feed.updatedAt?`${new Date(feed.updatedAt).toLocaleString()} 갱신 · ${feed.stats.success||0}/${feed.stats.sourceCount||0}개 출처`:'첫 자동수집 전입니다.';
  recommended.innerHTML=(feed.jobs||[]).filter(j=>classify(j).fit).slice(0,5).map(card).join('')||'<div class="empty">추천 공고가 없습니다.</div>';
  jobList.innerHTML=visibleJobs().map(card).join('')||'<div class="empty">조건에 맞는 공고가 없습니다.</div>';
  favoriteList.innerHTML=(feed.jobs||[]).filter(j=>state.favorites.includes(key(j))).map(card).join('')||'<div class="empty">즐겨찾기한 공고가 없습니다.</div>';
  const iq=(instSearch.value||'').toLowerCase();
  instList.innerHTML=institutions.filter(i=>i.name.toLowerCase().includes(iq)).map(i=>`<div class="inst"><div class="row"><div><strong>${esc(i.name)}</strong><div class="muted">${esc(i.type||'')}</div></div><a class="secondary" target="_blank" href="${esc(i.source)}">공식 채용</a></div><div class="muted">${esc(i.eligibility||'')} · 예상 ${(i.months||[]).join(', ')}월</div></div>`).join('');
}
window.fav=k=>{const i=state.favorites.indexOf(k);i>=0?state.favorites.splice(i,1):state.favorites.push(k);save();render()}
window.openDetail=k=>{
  const j=(feed.jobs||[]).find(x=>key(x)===k);if(!j)return;
  state.seen[k]=true;save();
  const c=classify(j);
  detail.innerHTML=`<div class="org">${esc(j.org)}</div><h2>${esc(j.title)}</h2><div class="badges">${c.fit?badge('고졸 가능','green'):badge('학력 확인')}${c.ulsan?badge('울산','blue'):''}${c.regular?badge('정규직 계열','green'):''}</div><div class="summary"><b>공고 요약</b><ul>${summary(j).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="detail-grid" style="margin-top:12px"><div class="detail-cell"><span>기관</span><strong>${esc(j.org)}</strong></div><div class="detail-cell"><span>마감일</span><strong>${esc(j.deadline||'원문 확인')}</strong></div><div class="detail-cell"><span>고졸 가능성</span><strong>${c.fit?'높음':'확인 필요'}</strong></div><div class="detail-cell"><span>울산 근무</span><strong>${c.ulsan?'관련 있음':'확인 필요'}</strong></div></div><a class="primary" style="display:block;text-align:center;margin-top:14px" target="_blank" href="${esc(j.link)}">원문 공고 열기</a>`;
  sheet.classList.add('open');render();
}
async function load(){
  try{
    [institutions,feed]=await Promise.all([
      fetch('./data/institutions.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()),
      fetch('./data/jobs.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json())
    ]);
    render();
  }catch(e){status.textContent='데이터 불러오기 실패: '+e.message}
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('main section').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.tab).classList.add('active')});
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>document.querySelector(`nav button[data-tab="${b.dataset.go}"]`).click());
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>sheet.classList.remove('open'));
search.oninput=render;instSearch.oninput=render;refreshBtn.onclick=load;
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
load();
</script>
</body>
</html>
